<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bassac Academy</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Simple Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <div class="logo">Bassac Academy</div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn btn-primary sign-up-btn" href="/auth/register">Sign Up</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Log in to your Bassac Academy account</p>
            </div>

            <form class="auth-form" id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" value="" id="remember-me">
                    <label class="form-check-label" for="remember-me">
                        Remember me
                    </label>
                </div>

                <div class="alert alert-danger d-none" id="login-error" role="alert">
                    Invalid email or password. Please try again.
                </div>

                <button type="submit" class="btn btn-primary">Log In</button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/auth/register">Sign Up</a></p>
                <p><a href="/auth/forgot-password">Forgot Password?</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Login JS -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    
    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Hide any previous error messages
        loginError.classList.add('d-none');
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        console.log('Form submission - Email:', email);
        
        try {
            console.log('Sending login request...');
            
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password }),
                credentials: 'include'
            });
            
            console.log('Response status:', response.status);
            
            // Try to get the response body
            let data;
            try {
                data = await response.json();
                console.log('Response data:', data);
            } catch (jsonError) {
                console.error('Error parsing JSON response:', jsonError);
                data = { message: 'Could not parse server response' };
            }
            
            if (!response.ok) {
                throw new Error(data.message || 'Login failed');
            }
            
            console.log('Login successful');
            
            // Store token in localStorage
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            
            // Redirect based on user role
            const userRole = data.user.role.toLowerCase();
            console.log('User role for redirection:', userRole);
            
            if (userRole === 'instructor' || userRole === 'teacher') {
                window.location.href = '/dashboard/teacher';
            } else if (userRole === 'admin') {
                window.location.href = '/dashboard/admin';
            } else {
                window.location.href = '/dashboard/student';
            }
            
        } catch (error) {
            console.error('Login error:', error);
            loginError.textContent = error.message || 'Login failed';
            loginError.classList.remove('d-none');
        }
    });
});
    </script>
</body>

</html>
