<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Bassac Academy</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/loader.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Custom styles */
        .password-input-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d;
        }

        .password-toggle:hover {
            color: #495057;
        }
    </style>
</head>

<body>
    <!-- Simple Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <div class="logo">Bassac Academy</div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">Log In</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h2>Create Your Account</h2>
                <p>Join Bassac Academy and start learning today</p>
            </div>

            <form class="auth-form" id="register-form">
                <div class="form-group">
                    <label for="username">Full Name</label>
                    <input type="text" id="username" name="username" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                    <small id="email-format" class="form-text text-muted d-none">Please enter a valid email
                        address.</small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-wrapper position-relative">
                        <input type="password" id="password" name="password" required
                            placeholder="Create a password (min. 8 characters)">
                        <span class="password-toggle" id="toggle-password">
                            <i class="fa fa-eye-slash"></i>
                        </span>
                    </div>
                    <small class="form-text text-muted">Password must have at least 8 characters, including uppercase,
                        lowercase, number, and special character.</small>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="password-input-wrapper position-relative">
                        <input type="password" id="confirm-password" name="confirm-password" required
                            placeholder="Confirm your password">
                        <span class="password-toggle" id="toggle-confirm-password">
                            <i class="fa fa-eye-slash"></i>
                        </span>
                    </div>
                </div>

                <div class="form-group">
                    <label>I want to register as:</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="role-student" value="student"
                            checked>
                        <label class="form-check-label" for="role-student">
                            Student
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="role-teacher" value="teacher">
                        <label class="form-check-label" for="role-teacher">
                            Teacher
                        </label>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" value="" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>
                    </label>
                </div>

                <div class="alert alert-danger d-none" id="register-error" role="alert">
                    Error message here
                </div>

                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="/login">Log In</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Registration JS -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const registerForm = document.getElementById('register-form');
            const registerError = document.getElementById('register-error');
            const usernameInput = document.getElementById('username');
            const emailInput = document.getElementById('email');
            const emailFormat = document.getElementById('email-format');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm-password');
            const termsCheckbox = document.getElementById('terms');
            const togglePassword = document.getElementById('toggle-password');
            const toggleConfirmPassword = document.getElementById('toggle-confirm-password');
            const passwordField = document.getElementById('password');
            const confirmPasswordField = document.getElementById('confirm-password');
            const submitButton = registerForm.querySelector('button[type="submit"]');

            // Form validation state
            const validationState = {
                username: false,
                email: false,
                password: false,
                confirmPassword: false,
                terms: false
            };

            // Update submit button state
            function updateSubmitButton() {
                const allValid = Object.values(validationState).every(value => value === true);
                submitButton.disabled = !allValid;
                
                if (allValid) {
                    submitButton.classList.add('btn-pulse');
                } else {
                    submitButton.classList.remove('btn-pulse');
                }
            }

            // Display validation message
            function showValidationMessage(message, isError = true) {
                registerError.textContent = message;
                
                if (isError) {
                    registerError.classList.add('alert-danger');
                    registerError.classList.remove('alert-success');
                } else {
                    registerError.classList.remove('alert-danger');
                    registerError.classList.add('alert-success');
                }
                
                registerError.classList.remove('d-none');
            }

            // Hide validation message
            function hideValidationMessage() {
                registerError.classList.add('d-none');
            }

            // Password toggle functionality
            togglePassword.addEventListener('click', function () {
                const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordField.setAttribute('type', type);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });

            toggleConfirmPassword.addEventListener('click', function () {
                const type = confirmPasswordField.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPasswordField.setAttribute('type', type);
                this.querySelector('i').classList.toggle('fa-eye');
                this.querySelector('i').classList.toggle('fa-eye-slash');
            });

            // Username validation
            usernameInput.addEventListener('blur', function () {
                const username = this.value.trim();
                
                if (!username) {
                    validationState.username = false;
                    this.classList.add('is-invalid');
                    showValidationMessage('Username is required');
                } else if (username.length < 3) {
                    validationState.username = false;
                    this.classList.add('is-invalid');
                    showValidationMessage('Username must be at least 3 characters');
                } else {
                    validationState.username = true;
                    this.classList.remove('is-invalid');
                    this.classList.add('is-valid');
                    hideValidationMessage();
                }
                
                updateSubmitButton();
            });

            // Email validation
            emailInput.addEventListener('blur', function () {
                const email = this.value.trim();
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                
                if (!email) {
                    validationState.email = false;
                    this.classList.add('is-invalid');
                    emailFormat.classList.add('d-none');
                    showValidationMessage('Email address is required');
                } else if (!emailRegex.test(email)) {
                    validationState.email = false;
                    this.classList.add('is-invalid');
                    emailFormat.classList.remove('d-none');
                    showValidationMessage('Please enter a valid email address');
                } else {
                    validationState.email = true;
                    this.classList.remove('is-invalid');
                    this.classList.add('is-valid');
                    emailFormat.classList.add('d-none');
                    hideValidationMessage();
                }
                
                updateSubmitButton();
            });

            // Password validation
            passwordInput.addEventListener('input', function () {
                validatePassword();
            });

            function validatePassword() {
                const password = passwordInput.value;
                let validationMessage = '';
                let isValid = true;

                // Check password strength
                if (password.length < 8) {
                    isValid = false;
                    validationMessage = 'Password must be at least 8 characters long.';
                } else if (!/[a-z]/.test(password)) {
                    isValid = false;
                    validationMessage = 'Password must contain at least one lowercase letter.';
                } else if (!/[A-Z]/.test(password)) {
                    isValid = false;
                    validationMessage = 'Password must contain at least one uppercase letter.';
                } else if (!/\d/.test(password)) {
                    isValid = false;
                    validationMessage = 'Password must contain at least one digit.';
                } else if (!/[@$!%*?&]/.test(password)) {
                    isValid = false;
                    validationMessage = 'Password must contain at least one special character (@$!%*?&).';
                }

                validationState.password = isValid;
                
                if (isValid) {
                    passwordInput.classList.remove('is-invalid');
                    passwordInput.classList.add('is-valid');
                    hideValidationMessage();
                } else {
                    passwordInput.classList.add('is-invalid');
                    passwordInput.classList.remove('is-valid');
                    showValidationMessage(validationMessage);
                }
                
                // Also validate confirm password if it has a value
                if (confirmPasswordInput.value) {
                    validateConfirmPassword();
                }
                
                updateSubmitButton();
            }

            // Confirm password validation
            confirmPasswordInput.addEventListener('input', function () {
                validateConfirmPassword();
            });

            function validateConfirmPassword() {
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                
                if (password !== confirmPassword) {
                    validationState.confirmPassword = false;
                    confirmPasswordInput.classList.add('is-invalid');
                    confirmPasswordInput.classList.remove('is-valid');
                    showValidationMessage("Passwords don't match");
                } else {
                    validationState.confirmPassword = true;
                    confirmPasswordInput.classList.remove('is-invalid');
                    confirmPasswordInput.classList.add('is-valid');
                    hideValidationMessage();
                }
                
                updateSubmitButton();
            }

            // Terms checkbox validation
            termsCheckbox.addEventListener('change', function () {
                validationState.terms = this.checked;
                
                if (!this.checked) {
                    showValidationMessage("You must agree to the Terms of Service and Privacy Policy");
                } else {
                    hideValidationMessage();
                }
                
                updateSubmitButton();
            });

            // Form submission
            registerForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                
                // Perform final validation check
                const username = usernameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                const confirmPassword = confirmPasswordInput.value;
                const role = document.querySelector('input[name="role"]:checked').value;
                const termsAccepted = termsCheckbox.checked;
                
                // Validate all fields one last time
                let isValid = true;
                
                if (!username || username.length < 3) {
                    isValid = false;
                    showValidationMessage('Please enter a valid username (at least 3 characters)');
                    return;
                }
                
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!email || !emailRegex.test(email)) {
                    isValid = false;
                    showValidationMessage('Please enter a valid email address');
                    return;
                }
                
                if (password.length < 8 || 
                    !/[a-z]/.test(password) || 
                    !/[A-Z]/.test(password) || 
                    !/\d/.test(password) || 
                    !/[@$!%*?&]/.test(password)) {
                    isValid = false;
                    showValidationMessage('Password does not meet all requirements');
                    return;
                }
                
                if (password !== confirmPassword) {
                    isValid = false;
                    showValidationMessage("Passwords don't match");
                    return;
                }
                
                if (!termsAccepted) {
                    isValid = false;
                    showValidationMessage("You must agree to the Terms of Service and Privacy Policy");
                    return;
                }
                
                // If all valid, submit the form
                if (isValid) {
                    try {
                        // Show loading animation
                        BassacLoader.show('Creating your account...');
                        
                        // Disable submit button
                        submitButton.disabled = true;
                        
                        // Send the registration request
                        const response = await fetch('/api/auth/register', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]')?.getAttribute('content') || ''
                            },
                            body: JSON.stringify({
                                username,
                                email,
                                password,
                                role
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.message || 'Registration failed');
                        }

                        // Success - redirect to verification page
                        BassacLoader.showSuccessThenRedirect(
                            'Registration successful!',
                            `/verify-email?email=${encodeURIComponent(email)}`,
                            2000
                        );

                    } catch (error) {
                        // Hide loader
                        BassacLoader.hide();
                        
                        // Re-enable submit button
                        submitButton.disabled = false;
                        
                        // Show error message
                        console.error('Registration error:', error);
                        showValidationMessage(error.message || 'Registration failed. Please try again.');
                        
                        // Add shake animation for visual feedback
                        document.querySelector('.auth-container').classList.add('shake');
                        setTimeout(() => {
                            document.querySelector('.auth-container').classList.remove('shake');
                        }, 820);
                    }
                }
            });

            // Initial validation check for all fields
            function validateAllFields() {
                if (usernameInput.value) {
                    usernameInput.dispatchEvent(new Event('blur'));
                }
                
                if (emailInput.value) {
                    emailInput.dispatchEvent(new Event('blur'));
                }
                
                if (passwordInput.value) {
                    validatePassword();
                }
                
                if (confirmPasswordInput.value) {
                    validateConfirmPassword();
                }
                
                validationState.terms = termsCheckbox.checked;
                updateSubmitButton();
            }
            
            // Run initial validation
            validateAllFields();
        });
    </script>
<script src="./js/loader.js"></script>
</body>

</html>
