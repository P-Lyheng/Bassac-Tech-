<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Bassac Academy</title>
    <link rel="stylesheet" href="../public/css/style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Simple Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <div class="logo">Bassac Academy</div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/auth/login">Log In</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Registration Form -->
    <div class="container">
        <div class="auth-container">
            <div class="auth-header">
                <h2>Create Your Account</h2>
                <p>Join Bassac Academy and start learning today</p>
            </div>
            
            <form class="auth-form" id="register-form">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password (min. 8 characters)">
                    <small class="form-text text-muted">Password must be at least 8 characters long.</small>
                </div>
                
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm your password">
                </div>
                
                <div class="form-group">
                    <label>I want to register as:</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="role-student" value="student" checked>
                        <label class="form-check-label" for="role-student">
                            Student
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="role" id="role-teacher" value="teacher">
                        <label class="form-check-label" for="role-teacher">
                            Teacher
                        </label>
                    </div>
                </div>
                
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" value="" id="terms" required>
                    <label class="form-check-label" for="terms">
                        I agree to the <a href="/terms">Terms of Service</a> and <a href="/privacy">Privacy Policy</a>
                    </label>
                </div>
                
                <div class="alert alert-danger d-none" id="register-error" role="alert">
                    Error message here
                </div>
                
                <button type="submit" class="btn btn-primary">Create Account</button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="/auth/login">Log In</a></p>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Registration JS -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const registerForm = document.getElementById('register-form');
            const registerError = document.getElementById('register-error');
            
            registerForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                // Hide any previous error messages
                registerError.classList.add('d-none');
                
                const fullname = document.getElementById('fullname').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const role = document.querySelector('input[name="role"]:checked').value;
                
                // Simple validation
                if (password !== confirmPassword) {
                    registerError.textContent = "Passwords don't match";
                    registerError.classList.remove('d-none');
                    return;
                }
                
                if (password.length < 8) {
                    registerError.textContent = "Password must be at least 8 characters long";
                    registerError.classList.remove('d-none');
                    return;
                }
                
                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ 
                            fullname, 
                            email, 
                            password,
                            role
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.message || 'Registration failed');
                    }
                    
                    // Store token in localStorage
                    localStorage.setItem('token', data.token);
                    
                    // Redirect based on user role
                    if (role === 'teacher') {
                        window.location.href = '/dashboard/teacher';
                    } else {
                        window.location.href = '/dashboard/student';
                    }
                    
                } catch (error) {
                    console.error('Registration error:', error);
                    registerError.textContent = error.message;
                    registerError.classList.remove('d-none');
                }
            });
        });
    </script>
</body>
</html>
