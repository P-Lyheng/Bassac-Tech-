<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Room | Bassac Academy</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Video room styles */
        .video-card {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .placeholder-video {
            height: 240px;
            background-color: #1a1a1a;
        }
        
        .message {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 10px;
            max-width: 85%;
        }
        
        .own-message {
            background-color: #d1e7dd;
            margin-left: auto;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .sender {
            font-weight: 500;
            font-size: 0.9em;
        }
        
        .timestamp {
            color: #6c757d;
            font-size: 0.8em;
        }
        
        .message-content {
            word-break: break-word;
        }
        
        #chat-panel {
            position: fixed;
            right: -320px;
            top: 0;
            bottom: 0;
            width: 320px;
            background-color: white;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            z-index: 1040;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        #chat-panel.open {
            right: 0;
        }
        
        #chat-header {
            padding: 15px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }
        
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }
        
        #chat-form {
            padding: 15px;
            border-top: 1px solid #dee2e6;
            display: flex;
        }
        
        #chat-input {
            flex: 1;
            margin-right: 10px;
        }

        .video-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover .video-controls {
            opacity: 1;
        }

        .participant-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Bassac Academy</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="teacher-dashboard.html">Dashboard</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <span id="username-display" class="text-white me-3">User</span>
                    <button id="logout-btn" class="btn btn-outline-light">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 id="session-title">Video Room</h2>
                <div id="session-status" class="badge bg-secondary">Initializing...</div>
            </div>
            <button id="leave-room-btn" class="btn btn-danger">
                <i class="fas fa-door-open me-1"></i> Leave Room
            </button>
        </div>

        <div class="row" id="video-grid">
            <!-- Videos will be added here by JavaScript -->
        </div>
        
        <div class="mt-4 text-center">
            <button id="toggle-chat" class="btn btn-outline-primary">
                <i class="fas fa-comments me-1"></i> Open Chat
            </button>
        </div>
    </div>
    
    <!-- Chat panel -->
    <div id="chat-panel">
        <div id="chat-header" class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Chat</h5>
            <button id="close-chat" class="btn-close"></button>
        </div>
        <div id="chat-messages">
            <!-- Messages will be added here by JavaScript -->
            <div class="message system-message">
                <div class="message-content">
                    Welcome to the class session! Messages will appear here.
                </div>
            </div>
        </div>
        <form id="chat-form">
            <input type="text" id="chat-input" class="form-control" placeholder="Type your message...">
            <button type="submit" id="send-message" class="btn btn-primary">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Socket.IO client -->
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    
    <!-- WebRTC adapter -->
    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>

    
    <!-- App scripts -->
    <script src="js/auth.js"></script>
    <script src="js/videoroom.js"></script>
</body>
</html>
